<div *ngIf="evento; else notFound" class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
  <!-- Imagen -->
  <div class="lg:col-span-1">
    <img
      [src]="evento.imagenUrl"
      [alt]="evento.nombre"
      class="w-full rounded-2xl object-cover border border-white/10"
      loading="lazy"
      (error)="($any($event.target)).src = 'https://picsum.photos/800/500?blur=1'"
    />
  </div>

  <!-- Contenido -->
  <div class="lg:col-span-2">
    <div class="flex items-start justify-between gap-6">
      <div>
        <div class="text-sm text-zinc-300">{{ evento.categoria }} · {{ evento.ubicacion }}</div>
        <h1 class="mt-2 text-3xl font-semibold">{{ evento.nombre }}</h1>
      </div>

      <div class="hidden lg:block">
        <button (click)="reservar($event)"
                class="rounded-full bg-white px-8 py-3 text-zinc-900 font-semibold shadow">
          Reservar
        </button>
      </div>
    </div>

    <div class="mt-6 text-zinc-200 leading-relaxed">
      <p>{{ evento.descripcion }}</p>
    </div>

    <!-- Botones móviles -->
    <div class="mt-6 lg:hidden">
      <button (click)="reservar($event)" class="w-full rounded-full bg-white px-4 py-3 text-zinc-900 font-semibold">
        Reservar
      </button>
    </div>

    <!-- Relacionados -->
    <div class="mt-12">
      <h3 class="text-xl font-semibold mb-4">Eventos relacionados</h3>

      <div *ngIf="relacionados.length === 0" class="text-zinc-400">
        No hay eventos relacionados disponibles.
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-3" *ngIf="relacionados.length > 0">
        <a *ngFor="let r of relacionados" [routerLink]="['/eventos', r.idEventos]"
           class="group relative overflow-hidden rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition">
          <img [src]="r.imagenUrl" [alt]="r.nombre"
               class="h-36 w-full object-cover"
               loading="lazy"
               (error)="($any($event.target)).src='https://picsum.photos/600/400?blur=1'"/>
          <div class="p-3">
            <div class="font-semibold line-clamp-1">{{ r.nombre }}</div>
            <div class="text-xs text-zinc-400 mt-1">{{ r.ubicacion }}</div>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>

<ng-template #notFound>
  <div class="rounded-2xl border border-white/10 bg-white/5 p-6 text-zinc-300">
    No se encontró el evento.
  </div>
</ng-template>
