<div class="rounded-3xl border border-white/10 bg-white/5 p-6">
  <h2 class="text-2xl font-semibold">Contacto</h2>

  <p class="mt-2 text-zinc-300">
    ¿Tienes alguna duda o sugerencia? Escríbenos.
  </p>

  <div *ngIf="enviado" class="mt-4 rounded-xl bg-green-500/20 p-3 text-green-200">
    Mensaje enviado correctamente ✅
  </div>

  <form class="mt-6 grid gap-4 max-w-2xl" (ngSubmit)="enviar()">
    
    <input
      class="rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-zinc-100 outline-none"
      placeholder="Nombre"
      [(ngModel)]="nombre"
      name="nombre"
    />

    <input
      class="rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-zinc-100 outline-none"
      placeholder="Email"
      type="email"
      [(ngModel)]="email"
      name="email"
    />

    <input
      class="rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-zinc-100 outline-none"
      placeholder="Asunto"
      [(ngModel)]="asunto"
      name="asunto"
    />

    <textarea
      class="rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-zinc-100 outline-none"
      rows="5"
      placeholder="Mensaje"
      [(ngModel)]="mensaje"
      name="mensaje"
    ></textarea>

    <button
      type="submit"
      class="rounded-xl bg-white px-5 py-3 font-semibold text-zinc-900 hover:opacity-95 w-fit"
    >
      Enviar
    </button>
  </form>
</div>
