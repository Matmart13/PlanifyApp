<h2 class="text-xl font-semibold mb-4">Reservas / Recordatorios</h2>

<p *ngIf="reservas.length === 0" class="text-zinc-300">
  Aún no tienes reservas.
</p>

<div class="space-y-3" *ngIf="reservas.length > 0">
  <div
    *ngFor="let r of reservas"
    class="rounded-2xl border border-white/10 bg-white/5 p-4 flex items-start justify-between gap-4"
  >
    <div>
      <div class="text-lg font-semibold">{{ r.eventTitulo }}</div>
      <div class="text-sm text-zinc-300">Fecha: {{ r.fechaISO }}</div>
      <div class="mt-2 text-sm">
        Estado:
        <span
          class="rounded-lg px-2 py-1 border border-white/10"
          [class.opacity-60]="r.estado === 'cancelada'"
        >
          {{ r.estado }}
        </span>
      </div>
    </div>

    <div class="flex gap-2">
      <button
        *ngIf="r.estado !== 'cancelada'"
        (click)="cancelar(r.id)"
        class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 font-semibold hover:bg-white/10"
      >
        Cancelar
      </button>
      <button
        (click)="borrar(r.id)"
        class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 font-semibold hover:bg-white/10"
      >
        Borrar
      </button>
    </div>
  </div>
</div>
