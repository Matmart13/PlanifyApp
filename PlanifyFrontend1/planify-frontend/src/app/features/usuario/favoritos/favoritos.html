<h2 class="text-xl font-semibold mb-4">Favoritos</h2>

<p *ngIf="eventosFav.length === 0" class="text-zinc-300">
  Aún no tienes favoritos.
</p>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4" *ngIf="eventosFav.length > 0">
  <div
    *ngFor="let e of eventosFav"
    class="rounded-2xl border border-white/10 bg-white/5 p-4"
  >
    <a [routerLink]="['/eventos', e.idEventos]" class="block hover:opacity-90">
      <div class="text-sm text-zinc-300">{{ e.categoria }} · {{ e.ubicacion }}</div>
      <div class="mt-1 text-lg font-semibold">{{ e.nombre }}</div>
      <div class="mt-3 text-sm text-zinc-300 line-clamp-2">{{ e.descripcion }}</div>
    </a>

   <button
  (click)="quitar(e.idEventos!)"
  class="mt-4 rounded-xl border border-white/10 bg-white/5 px-4 py-2 font-semibold hover:bg-white/10"
>
  Quitar
</button>
  </div>
</div>
